<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scraper local</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
      body { background-color: #f8f9fa; }
      pre { white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row mb-4">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="card-title h3 mb-3">Scraper un site web</h1>
              <p class="text-muted">Entrez une URL et un sélecteur CSS pour récupérer des éléments spécifiques.</p>
              <form method="POST" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="url">URL du site</label>
                  <input class="form-control" type="url" id="url" name="url" placeholder="https://exemple.com" required value="{{ url }}">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="selector">Sélecteur CSS</label>
                  <input class="form-control" type="text" id="selector" name="selector" placeholder="p, h1, .classe, #id" required value="{{ selector }}">
                  <div class="form-text">Par défaut : <code>p</code></div>
                </div>
                <button class="btn btn-primary" type="submit">Lancer le scraping</button>
              </form>
              {% if error %}
                <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
              {% endif %}
            </div>
          </div>
        </div>
      </div>

      {% if data %}
        <div class="row">
          <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h5 mb-3">Résultats ({{ data|length }})</h2>
                <div class="accordion" id="resultsAccordion">
                  {% for item in data %}
                    <div class="accordion-item">
                      <h2 class="accordion-header" id="heading-{{ loop.index }}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ loop.index }}" aria-expanded="false" aria-controls="collapse-{{ loop.index }}">
                          Élément {{ loop.index }}
                        </button>
                      </h2>
                      <div id="collapse-{{ loop.index }}" class="accordion-collapse collapse" aria-labelledby="heading-{{ loop.index }}" data-bs-parent="#resultsAccordion">
                        <div class="accordion-body">
                          <p><strong>Texte :</strong> {{ item.text }}</p>
                          <p class="mb-1"><strong>HTML :</strong></p>
                          <pre class="bg-light p-3 border rounded">{{ item.html }}</pre>
                        </div>
                      </div>
                    </div>
                  {% endfor %}
                </div>
              </div>
            </div>
          </div>
        </div>
      {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
